<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgOliva" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0f2617" />
      <stop offset="60%" stop-color="#07140B" />
      <stop offset="100%" stop-color="#040b06" />
    </radialGradient>
    <linearGradient id="vinhoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b81d2c" />
      <stop offset="50%" stop-color="#8F0F1B" />
      <stop offset="100%" stop-color="#5a0810" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#c4c4c4" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadowLanding" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#8F0F1B" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Fundo Verde Oliva Escuro -->
  <rect width="512" height="512" rx="112" fill="url(#bgOliva)" />
  
  <!-- Borda Prata Fina -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#silverGrad)" stroke-width="3" opacity="0.4" />

  <!-- Faixa decorativa Vinho Nobre no topo -->
  <path d="M 60 48 L 452 48" stroke="url(#vinhoGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8" />

  <!-- Letra L estilizada de Loyola's Lanches -->
  <g filter="url(#shadowLanding)">
    <path d="M 148 118 
             L 218 118 
             Q 224 118 224 124
             L 224 330 
             Q 224 338 232 338
             L 364 338
             Q 372 338 372 346
             L 372 396
             Q 372 402 364 402
             L 148 402
             Q 140 402 140 394
             L 140 126
             Q 140 118 148 118 Z" 
          fill="url(#vinhoGrad)" />
  </g>

  <!-- Selo "TRADIÇÃO" em Vinho/Prata -->
  <g>
    <rect x="236" y="148" width="186" height="58" rx="14" fill="#0c1d11" stroke="#8F0F1B" stroke-width="2" />
    <circle cx="260" cy="177" r="6" fill="#c4c4c4" />
    <text x="278" y="184" fill="#f1f5f9" font-family="'Montserrat', -apple-system, sans-serif" font-weight="700" font-size="20" letter-spacing="2">LANCHES</text>
  </g>

  <!-- Subtítulo 18 Anos -->
  <text x="256" y="440" text-anchor="middle" fill="#c4c4c4" font-family="'Montserrat', sans-serif" font-size="16" font-weight="600" letter-spacing="3" opacity="0.8">DESDE 2006 · ARARETAMA</text>
</svg>
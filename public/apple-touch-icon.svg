<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <radialGradient id="appleGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1f1f22" />
      <stop offset="100%" stop-color="#0b0b0c" />
    </radialGradient>
    <linearGradient id="appleRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a15" />
      <stop offset="60%" stop-color="#e10600" />
      <stop offset="100%" stop-color="#8a0300" />
    </linearGradient>
  </defs>

  <!-- iOS square mask automatically rounds corners, so fill entire canvas -->
  <rect width="180" height="180" fill="url(#appleGlow)" />
  <rect x="0" y="0" width="180" height="180" fill="none" stroke="#27272a" stroke-width="4" />
  <path d="M 20 16 L 160 16" stroke="url(#appleRed)" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />

  <!-- L -->
  <path d="M 48 40 
           L 74 40 
           Q 78 40 78 44
           L 78 116 
           Q 78 120 82 120
           L 132 120
           Q 136 120 136 124
           L 136 142
           Q 136 146 132 146
           L 48 146
           Q 44 146 44 142
           L 44 44
           Q 44 40 48 40 Z" 
        fill="url(#appleRed)" />

  <!-- Badge GESTÃO -->
  <rect x="88" y="50" width="74" height="28" rx="8" fill="#151516" stroke="#e10600" stroke-width="1.8" />
  <circle cx="98" cy="64" r="3.5" fill="#22c55e" />
  <text x="107" y="68" fill="#f5f5f6" font-family="'Oswald', sans-serif" font-weight="700" font-size="10.5" letter-spacing="1">GESTÃO</text>
</svg>

name: Exportacao Documentada Loyola's
on:
  push:
    branches: [entrega-documentada-20261015]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exportar fontes, modulos e textos concatenados
        run: python tools/export_bundles.py
      - name: Criar ou atualizar release documentada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="codigo-loyolas-20261015"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Loyola's Lanches - codigo e modulos (15-10-2026)" --notes "Snapshot documentado da branch fix-landing-controles-20261014. Frontend React/Vite, PocketBase em ambiente separado. Os ZIPs preservam as dependencias compartilhadas. Arquivo .env privado foi excluido."
          gh release upload "$TAG" export_artifacts/* --clobber

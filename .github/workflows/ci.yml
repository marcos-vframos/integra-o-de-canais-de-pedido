name: CI — Site e Gestor

on:
  push:
    branches: [main, landing-loja-integradas-20261016, feat-supabase-runtime-loyolas-20261019]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build:cliente
      - run: pnpm run build:gestao
